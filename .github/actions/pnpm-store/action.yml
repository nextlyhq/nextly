name: pnpm store
description: >-
  Restores pnpm's package store before an install, on every event, and saves it
  after one, on a push only (`save: "true"`).

# A dependency cache is written only by `main`'s pushes and read everywhere
# else, the same split as the shared turbo cache. A pull request that saved its
# own store kept a copy under its merge ref that nobody else reads, often of the
# very key `main` saves moments later, and each such copy is several hundred MB
# of the repository's cache allowance.
#
# Restored by the lockfile's exact key, else by the newest store for the
# runner's platform: a pull request that changes the lockfile then installs
# from `main`'s store and fetches only what changed.
#
# Saving looks the key up first, so of the many jobs a push to `main` runs on
# one platform, only the first to finish its install uploads, and the rest skip
# without a reservation warning. The store is pruned to this lockfile first, so
# one restored by prefix does not carry every earlier lockfile's packages
# forward.
#
# Needs pnpm on the PATH (`pnpm/action-setup`) and the repository checked out.

inputs:
  save:
    description: '"true" to save the store after an install, instead of restoring it before one.'
    default: "false"

runs:
  using: composite
  steps:
    - name: Find the store
      id: store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Restore the store
      if: inputs.save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Ask whether this store is saved already
      id: saved
      if: inputs.save == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        lookup-only: true

    - name: Prune the store to this lockfile
      if: inputs.save == 'true' && steps.saved.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm store prune

    - name: Save the store
      if: inputs.save == 'true' && steps.saved.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.store.outputs.path }}
        key: pnpm-store-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
