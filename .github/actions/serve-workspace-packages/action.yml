name: Serve the workspace packages
description: >-
  Builds every publishable workspace package, packs it, and serves the tarballs
  from a registry running inside the job, so a scaffold installs the packages
  under review by version rather than the last release from npm.

# Run on the repository's own Node (the build tools need it), before any step
# that switches Node for the scaffold. The registry keeps running for the rest
# of the job, and the scaffold finds it through `$HOME/.npmrc`.

runs:
  using: composite
  steps:
    # Every scaffold job installs these rather than what npm has. The CLI under test
    # is this commit's, so its generator and templates are this commit's too, and a
    # project pairing them with the last release's `nextly` is a combination no user
    # can get: the packages version in lockstep, and a user's CLI and core come from
    # the same release. Against the registry a template that uses a new core API
    # fails for a reason that is not a defect, as it did when the blog template set
    # `admin.defaultColumns`, and after the release it would pass while a regression
    # in the core went untested.
    #
    # `pnpm pack` rather than a workspace link, because packing is what rewrites
    # `workspace:*` to a concrete version — a linked source directory would carry
    # the protocol into a project that is not a workspace and fail to install.
    - name: Pack the workspace packages a scaffold installs
      shell: bash
      run: |
        mkdir -p /tmp/nextly-workspace-packs

        # The set is DERIVED from the workspace, not listed here. A list was listed here,
        # and it went stale: `nextly` and `plugin-sdk` both depend on
        # `@nextlyhq/blocks-engine`, which was never packed — so `pnpm pack` rewrote that
        # `workspace:*` to a concrete version and the install resolved it FROM THE REGISTRY.
        # These legs were therefore testing the PUBLISHED blocks-engine while reporting on
        # the workspace, and on a release PR — where the bumped version does not exist yet —
        # the same gap fails outright with ETARGET.
        #
        # `create-nextly-app` is excluded because it is the scaffolder rather than a
        # dependency of what it scaffolds; its own pack step covers it.
        #
        # The names are a question the manifests answer, and a second answer agrees only
        # until someone adds a package. That is exactly what happened here once already.
        PKGS=$(node -e '
          const fs = require("node:fs");
          const names = fs.readdirSync("packages").filter(dir => {
            try {
              const manifest = JSON.parse(
                fs.readFileSync(`packages/${dir}/package.json`, "utf8")
              );
              return manifest.private !== true && manifest.name &&
                manifest.name !== "create-nextly-app";
            } catch { return false; }
          });
          if (names.length === 0) { throw new Error("no publishable packages found"); }
          console.log(names.join(" "));
        ')
        echo "packing: $PKGS"

        # Built with the same list. These packages publish only `dist`, so packing one
        # unbuilt SUCCEEDS and yields a tarball of metadata with no code — the pin would
        # then replace working registry packages with empty ones and the leg would fail to
        # resolve an entry point, blaming the template. The trailing `...` includes each
        # package itself as well as its dependencies.
        FILTERS=""
        for dir in $PKGS; do
          NAME=$(node -p "require('./packages/$dir/package.json').name")
          FILTERS="$FILTERS --filter=$NAME..."
        done
        # shellcheck disable=SC2086
        pnpm turbo build $FILTERS

        for dir in $PKGS; do
          (cd "packages/$dir" && pnpm pack --pack-destination /tmp/nextly-workspace-packs)
        done

        # Controls on that loop. Counting files is not enough: `pnpm pack` exits 0 for an
        # unbuilt package too, so the count would match while the tarballs held no code.
        # Each one is opened and required to contain a `dist` entry.
        #
        # The expected count is DERIVED from the same list rather than a fixed number. A
        # literal was what let the previous gap hide: nine tarballs satisfied `-ge 9` while
        # the tenth package the scaffold needed was never packed at all.
        expected=$(echo "$PKGS" | wc -w | tr -d ' ')
        count=$(ls /tmp/nextly-workspace-packs/*.tgz 2>/dev/null | wc -l | tr -d ' ')
        echo "packed tarballs: $count (expected $expected)"
        [ "$count" -eq "$expected" ] || { echo "expected $expected tarballs, got $count"; exit 1; }

        # Each tarball is opened and required to contain the FIRST path its own manifest
        # declares under `files`. `pnpm pack` exits 0 for an unbuilt package too, so a
        # count alone would be satisfied by tarballs of metadata with no code — the pin
        # would then replace working registry packages with empty ones and the leg would
        # fail to resolve an entry point, blaming the template.
        #
        # Read from the manifest rather than assuming `dist`. Not every publishable
        # package builds: `@nextlyhq/admin-css` has no build script and publishes `src`
        # and `bin`, so a hardcoded `dist` assertion fails it forever — which is the same
        # mistake as the hardcoded package list this step just stopped making, one level
        # down. Negation entries (`!dist/metafile-*.json`) are skipped: they subtract from
        # a set rather than naming something that must be present.
        for dir in $PKGS; do
          NAME=$(node -p "require('./packages/$dir/package.json').name")
          WANT=$(node -p "
            (require('./packages/$dir/package.json').files || [])
              .filter(entry => !entry.startsWith('!'))[0] || ''
          ")
          [ -n "$WANT" ] || { echo "$NAME declares no files[] — cannot verify its tarball"; exit 1; }

          TGZ=$(ls /tmp/nextly-workspace-packs/*.tgz | while read -r f; do
            tar -xzOf "$f" package/package.json 2>/dev/null \
              | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{if(JSON.parse(d).name===process.argv[1])console.log(process.argv[2])}catch{}})" "$NAME" "$f"
          done | head -1)
          [ -n "$TGZ" ] || { echo "no tarball found for $NAME"; exit 1; }

          entries=$(tar -tzf "$TGZ" | grep -c "^package/$WANT" || true)
          echo "$(basename "$TGZ"): $entries entries under $WANT"
          [ "$entries" -gt 0 ] || {
            echo "$(basename "$TGZ") contains nothing under $WANT — it was packed unbuilt"
            exit 1
          }
        done

    # The packed tarballs are served from a registry running inside the job, and the
    # scaffold installs them BY VERSION. The mechanism this replaces rewrote the generated
    # manifest to `file:` specifiers, and pnpm applies that rewrite to peer RANGES as well as
    # to dependency specs. No resolved semver version satisfies a `file:` range, so pnpm
    # reported `unmet peer nextly@file:...: found 0.0.2-alpha.57` with a correct copy
    # installed, never linked the peer, and the build failed on `Can't resolve
    # '@nextlyhq/plugin-sdk/admin'`. npm's hoisted layout hid the same defect.
    #
    # Publishing real tarballs removes that class rather than narrowing it: peer ranges stay
    # semver, and the generated manifest is not modified at all. The generator already writes
    # `^0.0.2-alpha.<current>`, which the packed version satisfies, so the app resolves the
    # packages under review while still declaring exactly the dependencies a user's project
    # would. A boundary the resolver agrees with, rather than a check that looks for crossings.
    - name: Serve the packed packages from a registry in this job
      shell: bash
      run: |
        mkdir -p /tmp/local-registry/storage

        # `nextly` and `@nextlyhq/*` are served with NO uplink, so a copy already on npm can
        # never answer for them. Everything else proxies, because the scaffold still installs
        # react, next and the rest the way a user would.
        cat > /tmp/local-registry/config.yaml <<'YAML'
        storage: ./storage
        uplinks:
          npmjs:
            url: https://registry.npmjs.org/
        packages:
          'nextly':
            access: $all
            publish: $all
            unpublish: $all
          '@nextlyhq/*':
            access: $all
            publish: $all
            unpublish: $all
          '**':
            access: $all
            publish: $all
            proxy: npmjs
        log: { type: stdout, format: pretty, level: warn }
        YAML

        # Written to the runner's home rather than passed as a flag, because the scaffold's
        # install is run by the CLI rather than by this step, and pnpm and npm both read it.
        #
        # The scope line is not redundant with the registry line. A `@scope:registry` entry
        # outranks even an explicit `--registry` argument, so without it every `@nextlyhq`
        # request goes to npmjs and the leg silently tests the last release.
        # STARTED BEFORE the redirect below, and the order is load-bearing. `verdaccio` is not a
        # repository dependency, so this fetches it, and a redirect written first would point that
        # fetch at a port nothing is listening on yet. It currently survives only because this
        # step runs from the repository root, whose own `.npmrc` names npmjs and outranks the
        # user-level file being written below — a working directory away from failing.
        npx --yes verdaccio@6 --config /tmp/local-registry/config.yaml --listen 4873 \
          > /tmp/local-registry/server.log 2>&1 &

        {
          echo "registry=http://localhost:4873/"
          echo "@nextlyhq:registry=http://localhost:4873/"
          echo "//localhost:4873/:_authToken=local-registry"
          echo "provenance=false"
        } >> "$HOME/.npmrc"

        for _ in $(seq 1 90); do
          curl -sf http://localhost:4873/-/ping > /dev/null 2>&1 && break
          sleep 1
        done
        curl -sf http://localhost:4873/-/ping > /dev/null 2>&1 || {
          echo "the local registry never came up"
          tail -20 /tmp/local-registry/server.log
          exit 1
        }

        # Refuse to publish anything until both names resolve locally. These packages carry
        # `publishConfig.registry: https://registry.npmjs.org/`, so a publish that reaches the
        # network is a publish to the real registry — measured locally, where exactly that
        # happened and was stopped only by the absence of a credential.
        for key in registry @nextlyhq:registry; do
          resolved=$(cd /tmp && npm config get "$key")
          case "$resolved" in
            http://localhost:4873*) echo "$key resolves to $resolved" ;;
            *) echo "refusing to publish: $key resolves to '$resolved'"; exit 1 ;;
          esac
        done

        # `--registry` is passed AS WELL as the config entry above, and neither is sufficient
        # alone: the flag is what overrides each package's own `publishConfig.registry`, and
        # the config entry is what wins for a scoped name where the flag does not.
        # `--tag` is required because every version here is a prerelease.
        #
        # Every published version also carries the `alpha` tag. The generator resolves a version
        # by asking npmjs for a package's dist-tags, and for a package whose only published
        # artifact is its `0.0.0` name-claiming placeholder there is no `alpha` tag to find — so
        # it writes the literal string `alpha` as the spec rather than a range. A local registry
        # carrying only `latest` cannot satisfy that, and the leg would fail on an unavailable
        # tag instead of testing the new package.
        published=0
        for f in /tmp/nextly-workspace-packs/*.tgz; do
          (cd /tmp && npm publish "$f" \
            --registry http://localhost:4873 --tag latest --provenance=false) \
            >> /tmp/local-registry/publish.log 2>&1 && published=$((published + 1))

          meta=$(tar -xzOf "$f" package/package.json)
          spec=$(node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const m=JSON.parse(d);console.log(m.name+'@'+m.version)})" <<<"$meta")
          (cd /tmp && npm dist-tag add "$spec" alpha --registry http://localhost:4873) \
            >> /tmp/local-registry/publish.log 2>&1
        done

        expected=$(ls /tmp/nextly-workspace-packs/*.tgz | wc -l | tr -d ' ')
        echo "published $published of $expected"
        [ "$published" -eq "$expected" ] || {
          echo "not every packed package reached the local registry"
          tail -30 /tmp/local-registry/publish.log
          exit 1
        }

        if grep -q "registry.npmjs.org" /tmp/local-registry/publish.log; then
          echo "a publish was aimed at the real registry"
          exit 1
        fi

        # A publish loop that silently no-opped would satisfy the count above, so each
        # package is asked for by the exact version the tarball carries.
        for f in /tmp/nextly-workspace-packs/*.tgz; do
          meta=$(tar -xzOf "$f" package/package.json)
          name=$(node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).name))" <<<"$meta")
          version=$(node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).version))" <<<"$meta")
          got=$(cd /tmp && npm view "$name@$version" version 2>/dev/null)
          [ "$got" = "$version" ] || {
            echo "$name@$version is not resolvable from the local registry (got '$got')"
            exit 1
          }
        done
        echo "all $expected packages resolve from the local registry"
