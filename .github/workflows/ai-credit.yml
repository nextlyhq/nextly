name: AI credit

# A commit, a pull request or an added line that credits an AI tool is
# refused. `scripts/ai-credit.mjs` holds the rule, which the commit-msg hook
# applies before a commit exists; this enforces it for a commit made past the
# hook, and for the squash commit the queue builds from a pull request's title
# and description.
#
# A title and a description are published the moment they are written, so an
# edit to either runs it again. In the queue it reads exactly what the queue
# would land.
#
# Neither this workflow nor the checker comes from the change, which could
# otherwise rewrite the rule it is judged by. On a pull request the workflow is
# `pull_request_target`, read from `main` whatever the change does to this
# file, and in the queue the checker comes from the queue's base. The change is
# only read by git: nothing from it runs, the token is read-only, and no secret
# is used. Every pull request is read, whatever branch it targets. It follows
# that this can be made a required check only once the checker is on `main`.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  credit:
    name: No AI credit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The change, with its whole history so both ends of its range are
      # present. Nothing from it runs.
      - name: Checkout the change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'merge_group' && github.ref || format('refs/pull/{0}/head', github.event.pull_request.number) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout the checker from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.repository.default_branch }}
          path: trusted
          sparse-checkout: scripts
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: trusted/.nvmrc

      # The checker loads only Node's own modules, so nothing is installed. It
      # runs in the change's checkout, whose history it reads.
      - name: Refuse AI credit
        run: node trusted/scripts/ai-credit.mjs
