name: Integration

# Real-database integration tests across every supported dialect. The unit
# suites mock the drivers and the browser tests run on sqlite only, so
# without this job a Postgres- or MySQL-specific regression in an adapter
# ships silently. Runs as a sibling of `ci`, so it adds no wall-time to a
# pull request.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# Read-only: the job never writes through the GITHUB_TOKEN.
permissions:
  contents: read

# Keyed per commit on `main` for the same reason as the CI workflow: a shared
# `github.ref` group cancelled the previous commit's run on every merge, and
# switching cancellation off is not enough — a group holds one running and one
# pending run, so a third merge displaces the second while it is still queued.
concurrency:
  group: integration-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration (${{ matrix.dialect }})
    runs-on: ubuntu-latest
    # 25 minutes until the suite outgrew it. The MySQL leg's last GREEN run
    # finished in 24m52s — eight seconds inside the limit — and every run after
    # that hit the ceiling. A timeout-minutes kill is reported as
    # conclusion=cancelled rather than failure, so the leg stopped contributing
    # a verdict while looking like somebody had cancelled the run: six
    # consecutive PRs merged with MySQL coverage that never reported.
    #
    # `packages/nextly` runs its integration files sequentially on purpose
    # (fileParallelism: false, single fork — the system-table suites share
    # fixed table names), so this number only ever needs to grow. Raised with
    # real headroom rather than to just past the last measurement, because a
    # ceiling set at the current duration is a ceiling that fails on variance.
    timeout-minutes: 45

    strategy:
      # One dialect failing must not cancel the others: seeing that a change
      # breaks only MySQL (and not all three) is exactly the signal that
      # locates the bug.
      fail-fast: false
      matrix:
        dialect: [postgres, mysql]

    # Both databases boot for both legs: GitHub cannot attach a `services:`
    # entry conditionally per matrix value, so the postgres leg also starts
    # mysql and vice versa. Each leg connects only to the one its dialect
    # needs. sqlite is a separate job below precisely because it needs
    # neither, and starting containers for it made an unrelated registry
    # outage able to fail a leg with no database dependency.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nextly
          POSTGRES_PASSWORD: nextly
          POSTGRES_DB: nextly_test
        ports:
          - 5432:5432
        # Health-gate so test steps never race a database that is still
        # starting up.
        options: >-
          --health-cmd "pg_isready -U nextly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nextly
          MYSQL_DATABASE: nextly_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pnextly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Scoped to the JOB, which is the part that matters. Six jobs across four
      # workflows cache `.turbo`, they run concurrently on the same commit, and
      # they build different filter sets — this one builds every package and app,
      # `preview` builds only packages, `integration` builds five of them. Keyed on
      # the commit alone they all wrote one entry, so whichever finished first
      # decided what every later reader got.
      #
      # A reader then restores a `.turbo` shaped by someone else's build, reports
      # `cache hit, replaying logs`, and lays down a `dist/` that does not contain
      # what its own tests import. The symptom is `Cannot find module
      # '.../dist/chunk-<hash>.mjs'` in a package the pull request never touched.
      # Re-running cannot clear it: the key is the commit, so a second attempt
      # scores an exact hit on the same foreign entry.
      #
      # `github.job` gives each job its own lineage. Nothing is lost — a job's own
      # previous runs are what its cache was ever useful for, and turbo entries are
      # content-addressed, so a narrower cache is a slower run and never a wrong
      # one.
      #
      # The `v2-` prefix retires every entry written under the shared scheme in one
      # step. Cache keys are immutable and `restore-keys` prefers the newest match,
      # so the entries already written would otherwise keep being selected.
      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-v2-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-v2-${{ runner.os }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The adapter suites read TEST_POSTGRES_URL / TEST_MYSQL_URL and fail
      # (rather than skip) when their database is unreachable, so each leg
      # runs only the packages its dialect covers. `test:integration`
      # declares `dependsOn: ^build`, so turbo builds prerequisites itself.
      #
      # The core `nextly` integration suite is now gated on every leg. Its
      # in-memory-SQLite suites (createTestNextly) run on all legs; its
      # dialect-gated files self-skip unless the matching URL is set, so the
      # pushschema / notifications / drizzle-v1 pg suites run on the postgres
      # leg and the mysql suites on the mysql leg. nextly's database/factory.ts
      # references @nextlyhq/adapter-{postgres,mysql,sqlite}, which are optional
      # peers. Turbo's `^build` does not traverse peerDependencies, so nextly
      # also lists them as devDependencies purely to give the build graph that
      # edge; without it `nextly#build` can start before the adapters emit their
      # declarations and fails on TS7016. They stay in the filter list so each
      # leg still builds all three regardless of which suites it runs.
      - name: Run integration tests (postgres)
        if: matrix.dialect == 'postgres'
        run: |
          pnpm turbo build --filter=nextly --filter=@nextlyhq/adapter-postgres --filter=@nextlyhq/adapter-mysql --filter=@nextlyhq/adapter-sqlite --filter=@nextlyhq/plugin-page-builder
          pnpm turbo test:integration --filter=@nextlyhq/adapter-postgres --filter=nextly --filter=@nextlyhq/plugin-page-builder
        env:
          TEST_POSTGRES_URL: postgres://nextly:nextly@localhost:5432/nextly_test
          TURBO_CACHE_DIR: .turbo

      - name: Run integration tests (mysql)
        if: matrix.dialect == 'mysql'
        run: |
          pnpm turbo build --filter=nextly --filter=@nextlyhq/adapter-postgres --filter=@nextlyhq/adapter-mysql --filter=@nextlyhq/adapter-sqlite --filter=@nextlyhq/plugin-page-builder
          pnpm turbo test:integration --filter=@nextlyhq/adapter-mysql --filter=nextly --filter=@nextlyhq/plugin-page-builder
        env:
          TEST_MYSQL_URL: mysql://root:nextly@127.0.0.1:3306/nextly_test
          TURBO_CACHE_DIR: .turbo

      # Only a job that finished its work publishes what it learned. A cancelled or
      # failed run leaves the cache as it found it — `actions/cache` saves in a post
      # step that runs however the job ended, and splitting restore from save is the
      # supported way to make that conditional (`save-always` was deprecated for it).
      - name: Save Turbo cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-v2-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

  # sqlite runs in-process against a throwaway file, so this job declares no
  # `services:` at all. Keeping it out of the matrix above means it never pulls
  # the postgres/mysql images it would not connect to, which removes its only
  # external network dependency: a container-registry outage can no longer fail
  # a leg that needs no database. The job name matches the old matrix leg so the
  # check keeps its identity.
  integration-sqlite:
    name: Integration (sqlite)
    runs-on: ubuntu-latest
    # Raised with the matrix legs above: this one passed at 22m18s, which is
    # inside 25 but not by enough to leave alone while its siblings move.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Scoped to the JOB, which is the part that matters. Six jobs across four
      # workflows cache `.turbo`, they run concurrently on the same commit, and
      # they build different filter sets — this one builds every package and app,
      # `preview` builds only packages, `integration` builds five of them. Keyed on
      # the commit alone they all wrote one entry, so whichever finished first
      # decided what every later reader got.
      #
      # A reader then restores a `.turbo` shaped by someone else's build, reports
      # `cache hit, replaying logs`, and lays down a `dist/` that does not contain
      # what its own tests import. The symptom is `Cannot find module
      # '.../dist/chunk-<hash>.mjs'` in a package the pull request never touched.
      # Re-running cannot clear it: the key is the commit, so a second attempt
      # scores an exact hit on the same foreign entry.
      #
      # `github.job` gives each job its own lineage. Nothing is lost — a job's own
      # previous runs are what its cache was ever useful for, and turbo entries are
      # content-addressed, so a narrower cache is a slower run and never a wrong
      # one.
      #
      # The `v2-` prefix retires every entry written under the shared scheme in one
      # step. Cache keys are immutable and `restore-keys` prefers the newest match,
      # so the entries already written would otherwise keep being selected.
      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-v2-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-v2-${{ runner.os }}-${{ github.job }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds all three adapters for the same reason the database job does:
      # nextly's database/factory.ts references them as optional peers, and
      # turbo's `^build` does not traverse peerDependencies.
      # `plugin-seo` runs on THIS leg only, unlike the packages beside it. Its
      # suites call `createTestNextly`, which boots on in-memory SQLite and
      # names no dialect, so the postgres and mysql legs would run byte-identical
      # work — three times the runtime for one answer. They are here rather than
      # in the unit `Test` step because each case boots a real instance, and
      # doing that while seventeen other suites run in parallel is what took one
      # past a 30s budget on CI while it finishes in about 1.5s alone.
      - name: Run integration tests (sqlite)
        run: |
          pnpm turbo build --filter=nextly --filter=@nextlyhq/adapter-postgres --filter=@nextlyhq/adapter-mysql --filter=@nextlyhq/adapter-sqlite --filter=@nextlyhq/plugin-page-builder --filter=@nextlyhq/plugin-seo
          pnpm turbo test:integration --filter=@nextlyhq/adapter-sqlite --filter=nextly --filter=@nextlyhq/plugin-page-builder --filter=@nextlyhq/plugin-seo
        env:
          TURBO_CACHE_DIR: .turbo

      # Only a job that finished its work publishes what it learned. A cancelled or
      # failed run leaves the cache as it found it — `actions/cache` saves in a post
      # step that runs however the job ended, and splitting restore from save is the
      # supported way to make that conditional (`save-always` was deprecated for it).
      - name: Save Turbo cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-v2-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
