name: Integration

# Real-database integration tests across every supported dialect. The unit
# suites mock the drivers and the browser tests run on sqlite only, so
# without this job a Postgres- or MySQL-specific regression in an adapter
# ships silently. Runs as a sibling of `ci`, so it adds no wall-time to a
# pull request.

# No path filter here. A workflow skipped by `on.paths-ignore` never creates its
# checks, so once the three legs are required a documentation pull request
# would wait for results that never come. The `changes` job below decides the
# same thing and the legs skip by `if:`, which reports `skipped`, a result the
# merge gate and the merge queue both accept.
#
# On a pull request the legs run only while it carries the `run-integration`
# label (the `changes` job's `requested`, read from the API when that job
# runs); the merge queue and `main` always run them, so nothing merges
# untested. Adding the label is handled by `integration-request.yml`, not by a
# `labeled` trigger here: see `scripts/integration-request.mjs` for why.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue tests each pull request again on the latest `main`, and
  # merges it only if the required checks pass there too.
  merge_group:
    types: [checks_requested]
  # main-catch-up.yml starts a run on main's newest commit when no run has
  # tested it; a dispatched run tests everything (`scripts/change-scope.mjs`
  # has no narrower rule for it).
  workflow_dispatch:

# Read-only: the job never writes through the GITHUB_TOKEN.
permissions:
  contents: read

# The wall-clock budget for ONE job's share of a dialect's suite: one shard
# of it, on every leg.
# Enforced per step rather than per job — see scripts/run-with-budget.sh for
# why the distinction decides whether a slow leg reports at all.
#
# Set with real headroom rather than just past the last measurement: a bound at
# the current duration is a bound that fires on variance, and this one is meant
# to catch a suite that has genuinely run away, not to police a slow morning on
# shared runners. How slow a morning gets was measured on 2026-10-18: the same
# 393 core files ran a median 1.54 times slower on the runner `main` got for
# b2cf477bd than on the one it got for 0898c3e50, an hour earlier, and the
# unsharded MySQL leg (about 38 minutes of suite on the fast runner) ran out of
# this budget with 65 files still to go.
#
# ONE knob for all three legs on purpose. Per-leg budgets would have to be
# re-tuned as each suite grows, and a budget nobody re-tunes is a budget that
# drifts back into firing on variance.
env:
  INTEGRATION_SUITE_BUDGET: 55m

# Keyed per commit on `main` for the same reason as the CI workflow: a shared
# `github.ref` group cancelled the previous commit's run on every merge, and
# switching cancellation off is not enough — a group holds one running and one
# pending run, so a third merge displaces the second while it is still queued.
#
# That every commit keeps its own group does not mean every commit does the
# work. The `changes` job asks first, and a run a newer push has overtaken
# skips its legs; queued runs therefore start, ask and stop within seconds, and
# only the newest tests. The queue stays short without anything being cancelled.
#
# Off a pull request the key also names the event, for the reason the CI
# workflow gives: a dispatched catch-up run and the push run of the same commit
# shared one group, and whichever started later cancelled the other. Only a
# pull request's runs cancel each other.
concurrency:
  group: integration-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether this run's legs have anything to do. Two answers skip them.
  #
  # A newer push to `main` already has a run of this workflow, whose verdict
  # includes this commit; a skipped job is how this repository says "this
  # commit cannot affect me", and nothing is cancelled, so `cancelled` keeps its
  # plain meaning. `.github/actions/superseded-on-main` carries the reasoning.
  #
  # Or every changed file is documentation: under `docs/`, or Markdown
  # anywhere, the same paths the trigger used to ignore. The comparison is the
  # one CI makes (`scripts/change-scope.mjs`), including on a push to `main`,
  # which compares with the last commit a leg actually tested, so a docs push
  # after a superseded code push still tests that code.
  changes:
    name: Decide what this commit can affect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      # A pull request's labels, read when this job runs.
      pull-requests: read
    outputs:
      superseded: ${{ steps.newer.outputs.superseded }}
      inert: ${{ steps.decide.outputs.inert }}
      # Always true in the merge queue and on `main`; on a pull request, true
      # only while it carries the `run-integration` label. Empty when the step
      # failed, which the legs read as asked for.
      requested: ${{ steps.requested.outputs.requested }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both ends of the comparison have to be present, or it falls open
          # and runs everything.
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Ask
        id: newer
        uses: ./.github/actions/superseded-on-main
        with:
          workflow: integration.yml
          # The jobs that run the suite, by the names their runs carry: each
          # shard of a sharded leg on its own, since a run where one shard was
          # cancelled did not test that shard's files, while the leg's
          # required check, which only reads the shards, would still read
          # `failure`, a verdict.
          substantive-job: |
            Integration (postgres) shard (1)
            Integration (postgres) shard (2)
            Integration (mysql) shard (1)
            Integration (mysql) shard (2)
            Integration (sqlite) shard (1)
            Integration (sqlite) shard (2)
          token: ${{ github.token }}
      - name: Decide
        id: decide
        env:
          SUPERSEDED: ${{ steps.newer.outputs.superseded }}
          LAST_TESTED_SHA: ${{ steps.newer.outputs.last-tested-sha }}
          SCOPE_TITLE: Integration scope
          INERT_PATHS: '(^docs/|\.md$)'
        run: node scripts/change-scope.mjs
      # Unconditional, so the step runs alike in every event; it says so in the
      # summary when a pull request's legs skip for want of the label, and
      # stays quiet when they would skip anyway (`inert`), since the label
      # would change nothing there.
      - name: Ask whether the legs were requested
        id: requested
        env:
          GH_TOKEN: ${{ github.token }}
          INERT: ${{ steps.decide.outputs.inert }}
        run: node scripts/integration-request.mjs requested

  # One job per dialect, each with a literal name and only its own database.
  #
  # These were one matrix job. A job-level `if` is applied BEFORE the matrix
  # expands, so a run this workflow skips (a newer push to `main` already has
  # one) reported a single skipped check whose name was the unevaluated
  # expression text, and no `Integration (postgres)` or `Integration (mysql)`
  # at all; `scripts/verify-merge.mjs` requires those names on a merge commit.
  # Measured on a probe run: a skipped matrix job's `name` is not evaluated,
  # `needs` included. A literal name survives a skip, so each leg now reports
  # under its own name, `skipped`, which is what the gate already accepts.
  #
  # The split also ends both databases booting for both legs: a `services:`
  # entry could not be chosen per matrix value, so the postgres leg started
  # mysql and vice versa. Each job below declares the one it connects to.
  # The setup the legs share lives in `.github/actions/integration-setup`.
  integration-postgres-shards:
    # Not a required check: `Integration (postgres)` below is, and it passes
    # only when every shard did. GitHub appends the matrix value to a name
    # with no expression in it, so the shards report as `... shard (1)` and
    # `... shard (2)`, and a skipped run as one `... shard`.
    name: Integration (postgres) shard
    needs: changes
    # `!cancelled()` so a `changes` job that FAILED (checkout, the action,
    # its timeout) does not skip this leg: with no `always()`-style override,
    # GitHub skips every dependent of a failed job, `skipped` passes the merge
    # gate, and three required checks would read as acceptable with nothing
    # run. A failed question has no outputs, so it falls open to running the
    # suite; only a cancelled workflow stays cancelled.
    if: ${{ !cancelled() && needs.changes.outputs.superseded != 'true' && needs.changes.outputs.inert != 'true' && needs.changes.outputs.requested != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      # Each shard's verdict is its own: one that fails does not cancel the
      # other, so a red run still says how the rest of the suite did.
      fail-fast: false
      # `--shard` hands each job the same number of files, not the same amount
      # of time, so shards finish apart by however their files differ. The
      # count is read from `strategy.job-total`, so adding a value here is the
      # whole change to run three.
      matrix:
        shard: [1, 2]
    # A BACKSTOP now, not the bound that should ever fire.
    #
    # 25 minutes until the suite outgrew it. The MySQL leg's last GREEN run
    # finished in 24m52s — eight seconds inside the limit — and every run after
    # that hit the ceiling. A timeout-minutes kill is reported as
    # conclusion=cancelled rather than failure, so the leg stopped contributing
    # a verdict while looking like somebody had cancelled the run: six
    # consecutive PRs merged with MySQL coverage that never reported.
    #
    # Raising it to 45 bought time and left that trap fully armed, which is how
    # it recurred: on 2026-09-10 three separate branches were killed at exactly
    # 45 minutes and all three read as cancellations. Raising the number is not
    # the fix, because `packages/nextly` runs its integration files sequentially
    # on purpose (fileParallelism: false, single fork — the system-table suites
    # share fixed table names), so this number only ever grows.
    #
    # So the real bound moved into the STEP, where overrunning exits non-zero
    # and the job FAILS (INTEGRATION_SUITE_BUDGET, above). This value only has
    # to stay far enough above it that the step's bound always fires first —
    # 55 for the suite plus checkout, install and build — leaving this to catch
    # a hang somewhere else in the job, which nothing else would end.
    timeout-minutes: 75

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nextly
          POSTGRES_PASSWORD: nextly
          POSTGRES_DB: nextly_test
        ports:
          - 5432:5432
        # Health-gate so test steps never race a database that is still
        # starting up.
        options: >-
          --health-cmd "pg_isready -U nextly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/integration-setup

      # The adapter suites read TEST_POSTGRES_URL / TEST_MYSQL_URL and fail
      # (rather than skip) when their database is unreachable, so each leg
      # runs only the packages its dialect covers. `test:integration`
      # declares `dependsOn: ^build`, so turbo builds prerequisites itself.
      #
      # The core `nextly` integration suite is gated on every leg. Its
      # in-memory-SQLite suites (createTestNextly) run on all legs; its
      # dialect-gated files self-skip unless the matching URL is set, so the
      # pushschema / notifications / drizzle-v1 pg suites run on the postgres
      # leg and the mysql suites on the mysql leg. nextly's database/factory.ts
      # references @nextlyhq/adapter-{postgres,mysql,sqlite}, which are optional
      # peers. Turbo's `^build` does not traverse peerDependencies, so nextly
      # also lists them as devDependencies purely to give the build graph that
      # edge; without it `nextly#build` can start before the adapters emit their
      # declarations and fails on TS7016. They stay in the filter list so each
      # leg still builds all three regardless of which suites it runs.
      - name: Run integration tests (postgres)
        run: |
          pnpm turbo build --filter=nextly --filter=@nextlyhq/adapter-postgres --filter=@nextlyhq/adapter-mysql --filter=@nextlyhq/adapter-sqlite --filter=@nextlyhq/plugin-page-builder --filter=@nextlyhq/plugin-commerce --filter=@nextlyhq/plugin-accounts --filter=@nextlyhq/plugin-form-builder
          scripts/run-with-budget.sh "$INTEGRATION_SUITE_BUDGET" \
            "shard ${{ matrix.shard }} of ${{ strategy.job-total }} of the PostgreSQL integration suite" \
            pnpm lane:test:integration:postgres -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          TEST_POSTGRES_URL: postgres://nextly:nextly@localhost:5432/nextly_test
          TURBO_CACHE_DIR: .turbo

      # Only a job that finished its work publishes what it learned. A cancelled or
      # failed run leaves the cache as it found it — `actions/cache` saves in a post
      # step that runs however the job ended, and splitting restore from save is the
      # supported way to make that conditional (`save-always` was deprecated for it).
      - name: Save Turbo cache
        # One shard saves: both build the same packages under the same key,
        # and a cache key can be written once.
        if: success() && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-v2-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

  # The required check `Integration (postgres)`, read by the ruleset and by
  # scripts/verify-merge.mjs: it passes only when every shard above passed.
  #
  # It runs on the same conditions as the shards, so a run that skips them
  # skips this too and reports `skipped` under this literal name, as the
  # unsharded leg did. When they did run, `needs.<id>.result` is `success`
  # only if every shard succeeded; anything else fails it, including a shard
  # cancelled by its own backstop, which on its own would read as no verdict.
  integration-postgres:
    name: Integration (postgres)
    needs: [changes, integration-postgres-shards]
    # `always()`, not `!cancelled()`: a shard stopped by its own backstop is
    # cancelled, and this check, skipped then, would read to the merge gate as
    # a pass. It runs on the shards' conditions otherwise, and fails unless
    # every shard succeeded; a run cancelled on purpose reads as failed here
    # rather than cancelled, on a head nothing merges.
    if: ${{ always() && needs.changes.outputs.superseded != 'true' && needs.changes.outputs.inert != 'true' && needs.changes.outputs.requested != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.integration-postgres-shards.result }}
        run: |
          if [ "$SHARDS" != "success" ]; then
            echo "::error::the postgres integration shards ended '$SHARDS', not 'success'"
            exit 1
          fi

  integration-mysql-shards:
    # Not a required check: `Integration (mysql)` below is, and it passes
    # only when every shard did. GitHub appends the matrix value to a name
    # with no expression in it, so the shards report as `... shard (1)` and
    # `... shard (2)`, and a skipped run as one `... shard`.
    name: Integration (mysql) shard
    needs: changes
    # `!cancelled()` so a `changes` job that FAILED (checkout, the action,
    # its timeout) does not skip this leg: with no `always()`-style override,
    # GitHub skips every dependent of a failed job, `skipped` passes the merge
    # gate, and three required checks would read as acceptable with nothing
    # run. A failed question has no outputs, so it falls open to running the
    # suite; only a cancelled workflow stays cancelled.
    if: ${{ !cancelled() && needs.changes.outputs.superseded != 'true' && needs.changes.outputs.inert != 'true' && needs.changes.outputs.requested != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      # The same split as the postgres leg, for the same reasons.
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The same backstop as the postgres leg, for the same reasons.
    timeout-minutes: 75

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nextly
          MYSQL_DATABASE: nextly_test
        ports:
          - 3306:3306
        # The data directory lives in memory, as docker-compose.test.yml has
        # always kept it for local runs. On the runner's disk, this leg's step
        # took anywhere from 22 to 56 minutes on main, while the postgres and
        # sqlite legs of the same commits held steady. MySQL syncs to disk on
        # every commit and every schema change, and the suite creates and drops
        # tables file after file, so its time followed the speed of a shared
        # runner's disk. A sync to memory costs nothing, and a database the job
        # throws away needs none of that durability.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pnextly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/mysql

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/integration-setup

      # MySQL 8.4 writes every commit's redo log and binary log to disk before
      # it returns, and its redo log is 100 MB. The core suite commits many
      # small transactions, so the leg spent its time waiting on those writes
      # ("Consider increasing innodb_redo_log_capacity") and overran its
      # budget with every test green. A throwaway test database needs neither
      # guarantee, so this relaxes both and enlarges the redo log; all three
      # settings change at runtime, so the service image stays as it is.
      - name: Give the test database room to write
        run: |
          mysql -h 127.0.0.1 -uroot -pnextly -e "SET GLOBAL innodb_redo_log_capacity = 1073741824; SET GLOBAL innodb_flush_log_at_trx_commit = 2; SET GLOBAL sync_binlog = 0;"
          mysql -h 127.0.0.1 -uroot -pnextly -N -e "SELECT @@innodb_redo_log_capacity, @@innodb_flush_log_at_trx_commit, @@sync_binlog;"

      # See the postgres leg for why every adapter is built on every leg.
      #
      # Every five minutes while the suite runs, the server prints the
      # connections held for over a minute, the metadata locks of any schema
      # where one is waiting, and the transactions open for over a minute. A
      # suite that stops waiting on one of these leaves no other record of
      # it, and only while it runs: the budget's stop ends the suite's
      # process, and its connections and locks with it.
      - name: Run integration tests (mysql)
        run: |
          pnpm turbo build --filter=nextly --filter=@nextlyhq/adapter-postgres --filter=@nextlyhq/adapter-mysql --filter=@nextlyhq/adapter-sqlite --filter=@nextlyhq/plugin-page-builder --filter=@nextlyhq/plugin-commerce --filter=@nextlyhq/plugin-accounts --filter=@nextlyhq/plugin-form-builder
          # The watcher sleeps in a child it waits on, and stops that child
          # when it is stopped: otherwise the sleep outlives it holding the
          # step's output open, and the step waits for it.
          (
            trap 'kill "$nap" 2>/dev/null; exit 0' TERM
            while :; do
              sleep 300 & nap=$!
              wait "$nap"
              echo "::group::What MySQL holds at $(date -u +%H:%M:%SZ)"
              mysql -h 127.0.0.1 -uroot -pnextly -t -e "SELECT ID,USER,DB,COMMAND,TIME,STATE,LEFT(INFO,200) AS INFO FROM information_schema.PROCESSLIST WHERE TIME > 60 AND USER <> 'event_scheduler' ORDER BY TIME DESC; SELECT OBJECT_TYPE,OBJECT_SCHEMA,OBJECT_NAME,LOCK_TYPE,LOCK_DURATION,LOCK_STATUS,OWNER_THREAD_ID FROM performance_schema.metadata_locks WHERE OBJECT_SCHEMA IN (SELECT OBJECT_SCHEMA FROM performance_schema.metadata_locks WHERE LOCK_STATUS = 'PENDING'); SELECT trx_id,trx_state,trx_started,trx_mysql_thread_id,LEFT(trx_query,200) AS trx_query FROM information_schema.INNODB_TRX WHERE trx_started < NOW() - INTERVAL 60 SECOND;" 2>&1 | grep -v "Using a password" || true
              echo "::endgroup::"
            done
          ) &
          watcher=$!
          # The suite's status is read on the line after it, with -e off around
          # it, so the lane's call ends its line as check-test-lanes requires and
          # a failed suite still stops the watcher before the step fails.
          set +e
          scripts/run-with-budget.sh "$INTEGRATION_SUITE_BUDGET" \
            "shard ${{ matrix.shard }} of ${{ strategy.job-total }} of the MySQL integration suite" \
            pnpm lane:test:integration:mysql -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          status=$?
          set -e
          kill "$watcher" 2>/dev/null || true
          wait "$watcher" 2>/dev/null || true
          exit "$status"
        env:
          TEST_MYSQL_URL: mysql://root:nextly@127.0.0.1:3306/nextly_test
          TURBO_CACHE_DIR: .turbo

      # Only a job that finished its work publishes what it learned. A cancelled or
      # failed run leaves the cache as it found it — `actions/cache` saves in a post
      # step that runs however the job ended, and splitting restore from save is the
      # supported way to make that conditional (`save-always` was deprecated for it).
      - name: Save Turbo cache
        # One shard saves: both build the same packages under the same key,
        # and a cache key can be written once.
        if: success() && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-v2-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

  # The required check `Integration (mysql)`, read by the ruleset and by
  # scripts/verify-merge.mjs: it passes only when every shard above passed.
  #
  # It runs on the same conditions as the shards, so a run that skips them
  # skips this too and reports `skipped` under this literal name, as the
  # unsharded leg did. When they did run, `needs.<id>.result` is `success`
  # only if every shard succeeded; anything else fails it, including a shard
  # cancelled by its own backstop, which on its own would read as no verdict.
  integration-mysql:
    name: Integration (mysql)
    needs: [changes, integration-mysql-shards]
    # `always()`, not `!cancelled()`: a shard stopped by its own backstop is
    # cancelled, and this check, skipped then, would read to the merge gate as
    # a pass. It runs on the shards' conditions otherwise, and fails unless
    # every shard succeeded; a run cancelled on purpose reads as failed here
    # rather than cancelled, on a head nothing merges.
    if: ${{ always() && needs.changes.outputs.superseded != 'true' && needs.changes.outputs.inert != 'true' && needs.changes.outputs.requested != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.integration-mysql-shards.result }}
        run: |
          if [ "$SHARDS" != "success" ]; then
            echo "::error::the mysql integration shards ended '$SHARDS', not 'success'"
            exit 1
          fi

  # sqlite runs in-process against a throwaway file, so this job declares no
  # `services:` at all and has no external network dependency: a
  # container-registry outage cannot fail a leg that needs no database.
  integration-sqlite-shards:
    # Not a required check: `Integration (sqlite)` below is, and it passes
    # only when every shard did. GitHub appends the matrix value to a name
    # with no expression in it, so the shards report as `... shard (1)` and
    # `... shard (2)`, and a skipped run as one `... shard`.
    name: Integration (sqlite) shard
    needs: changes
    # `!cancelled()` so a `changes` job that FAILED (checkout, the action,
    # its timeout) does not skip this leg: with no `always()`-style override,
    # GitHub skips every dependent of a failed job, `skipped` passes the merge
    # gate, and three required checks would read as acceptable with nothing
    # run. A failed question has no outputs, so it falls open to running the
    # suite; only a cancelled workflow stays cancelled.
    if: ${{ !cancelled() && needs.changes.outputs.superseded != 'true' && needs.changes.outputs.inert != 'true' && needs.changes.outputs.requested != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      # The same split as the postgres leg, for the same reasons: run whole,
      # this leg's suite ran past INTEGRATION_SUITE_BUDGET on main and on pull
      # requests alike, so a run ended red with files still to go.
      fail-fast: false
      matrix:
        shard: [1, 2]
    # The same backstop as the database legs, for the same reasons: the bound
    # that should ever fire is INTEGRATION_SUITE_BUDGET on the step, which
    # reports as a failure. It moves with its siblings so there is one rule to
    # reason about rather than a per-leg ceiling nobody re-derives.
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/integration-setup

      # Builds all three adapters for the same reason the database legs do:
      # nextly's database/factory.ts references them as optional peers, and
      # turbo's `^build` does not traverse peerDependencies.
      # `plugin-seo` runs on THIS leg only, unlike the packages beside it. Its
      # suites call `createTestNextly` and name no dialect, so it boots on
      # in-memory SQLite and the postgres and mysql legs would run
      # byte-identical work — three times the runtime for one answer.
      # `plugin-page-builder`, `plugin-commerce`, `plugin-accounts` and
      # `plugin-form-builder` are in all three because their suites DO take a
      # dialect, which is the property that decides this rather than the kind
      # of package it is. One suite taking a dialect is enough: a package's
      # suites run together, so the others repeat on each leg, which for Form
      # Builder costs well under a minute a leg. They are here rather than in the unit `Test` step because
      # each case boots a real instance, and doing that while every other
      # package's suite runs in parallel is what took one past a 30s budget on
      # CI while it finishes in about 1.5s alone.
      #
      # Every package of the lane takes the same shard, so each one splits its
      # own files between the jobs; a package with fewer files than shards
      # passes the shard that gets none (merge-queue-workflows.test.mjs).
      - name: Run integration tests (sqlite)
        run: |
          pnpm turbo build --filter=nextly --filter=@nextlyhq/adapter-postgres --filter=@nextlyhq/adapter-mysql --filter=@nextlyhq/adapter-sqlite --filter=@nextlyhq/plugin-page-builder --filter=@nextlyhq/plugin-commerce --filter=@nextlyhq/plugin-accounts --filter=@nextlyhq/plugin-seo --filter=@nextlyhq/plugin-form-builder
          scripts/run-with-budget.sh "$INTEGRATION_SUITE_BUDGET" \
            "shard ${{ matrix.shard }} of ${{ strategy.job-total }} of the SQLite integration suite" \
            pnpm lane:test:integration:sqlite -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          TURBO_CACHE_DIR: .turbo

      # Only a job that finished its work publishes what it learned. A cancelled or
      # failed run leaves the cache as it found it — `actions/cache` saves in a post
      # step that runs however the job ended, and splitting restore from save is the
      # supported way to make that conditional (`save-always` was deprecated for it).
      - name: Save Turbo cache
        # One shard saves: both build the same packages under the same key,
        # and a cache key can be written once.
        if: success() && matrix.shard == 1
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-v2-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

  # The required check `Integration (sqlite)`, read by the ruleset and by
  # scripts/verify-merge.mjs: it passes only when every shard above passed.
  #
  # It runs on the same conditions as the shards, so a run that skips them
  # skips this too and reports `skipped` under this literal name, as the
  # unsharded leg did. When they did run, `needs.<id>.result` is `success`
  # only if every shard succeeded; anything else fails it, including a shard
  # cancelled by its own backstop, which on its own would read as no verdict.
  integration-sqlite:
    name: Integration (sqlite)
    needs: [changes, integration-sqlite-shards]
    # `always()`, not `!cancelled()`: a shard stopped by its own backstop is
    # cancelled, and this check, skipped then, would read to the merge gate as
    # a pass. It runs on the shards' conditions otherwise, and fails unless
    # every shard succeeded; a run cancelled on purpose reads as failed here
    # rather than cancelled, on a head nothing merges.
    if: ${{ always() && needs.changes.outputs.superseded != 'true' && needs.changes.outputs.inert != 'true' && needs.changes.outputs.requested != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.integration-sqlite-shards.result }}
        run: |
          if [ "$SHARDS" != "success" ]; then
            echo "::error::the sqlite integration shards ended '$SHARDS', not 'success'"
            exit 1
          fi
