name: Secret scan

# Runs gitleaks on every PR, every push to main, and every pull request the
# merge queue tests, so nothing committed locally without the pre-commit hook
# (or pushed from someone bypassing it) lands in the repo unscanned.
#
# Pre-commit covers the local case via .husky/pre-commit; this is the
# enforcement gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The queue merges only what passes its required checks on the queue's own
  # commit, so the scan has to run, and scan, there too.
  merge_group:
    types: [checks_requested]

# The scan only reads history; the token never needs write access.
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history is needed for `gitleaks detect` to scan every
          # commit in the range, not just the merge result.
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 requires a paid license for org
      # repos as of mid-2023. Use the OSS binary directly — no license
      # required, same scan rules.
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          # Checksum from the release's gitleaks_<ver>_checksums.txt. Verifying
          # before extraction means a tampered or substituted download fails
          # the job instead of executing.
          GITLEAKS_SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin gitleaks < /tmp/gitleaks.tar.gz
          gitleaks version

      # Scope the scan to the commits this run adds, not full history:
      # pre-existing findings in old commits aren't regressions and shouldn't
      # block new merges; they are tracked as their own cleanup.
      #
      # One step decides the range for every event, and it FAILS on any event
      # it has no range for. A scan step per event skips itself on an event
      # none of them names, and the job then passes having scanned nothing.
      # Failing closed means a new trigger either gets a range here or turns
      # red.
      #
      # - pull_request: its own commits, from the base branch it targets.
      # - push: the pushed range; a first push reports an all-zero `before`,
      #   so the head commit alone is scanned.
      # - merge_group: exactly what the queue would merge, from the queue's
      #   base (the latest `main`) to its head (`main` plus the queued pull
      #   requests), both taken from the event.
      #
      # An empty or unreadable range fails too: gitleaks passes a range with
      # no commits in it, which would be a scan of nothing reported as clean.
      # Event values reach the script through the environment, never spliced
      # into its text.
      - name: Run gitleaks on the commits this run adds
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # An unset value reads as empty, so each check below refuses it by
          # name rather than stopping on `set -u` with no explanation.
          : "${EVENT:=}" "${BASE_REF:=}" "${PUSH_BEFORE:=}" "${PUSH_AFTER:=}" "${QUEUE_BASE:=}" "${QUEUE_HEAD:=}"
          refuse() {
            echo "::error title=Secret scan::$1"
            exit 1
          }
          case "$EVENT" in
            pull_request)
              [ -n "$BASE_REF" ] || refuse "a pull_request event with no base branch"
              RANGE="origin/${BASE_REF}..HEAD"
              ;;
            push)
              [ -n "$PUSH_AFTER" ] || refuse "a push event with no head commit"
              if [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
                RANGE="${PUSH_AFTER}~1..${PUSH_AFTER}"
              else
                RANGE="${PUSH_BEFORE}..${PUSH_AFTER}"
              fi
              ;;
            merge_group)
              [ -n "$QUEUE_BASE" ] && [ -n "$QUEUE_HEAD" ] || refuse "a merge_group event with no base or no head commit"
              RANGE="${QUEUE_BASE}..${QUEUE_HEAD}"
              ;;
            *)
              refuse "no range to scan for a ${EVENT:-unnamed} event; give it one here before triggering this workflow on it"
              ;;
          esac
          COUNT=$(git rev-list --count "$RANGE") || refuse "cannot read the range $RANGE"
          [ "$COUNT" -gt 0 ] || refuse "the range $RANGE holds no commits, so a scan of it would examine nothing"
          echo "scanning $COUNT commit(s) in $RANGE"
          gitleaks detect \
            --source . \
            --log-opts="$RANGE" \
            --redact --no-banner --verbose
