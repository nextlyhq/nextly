name: Admin speed

# How much a production start and the admin's main screens cost, counted on
# SQLite, PostgreSQL and MySQL against the playground's production build, and
# compared with the numbers pinned in e2e/admin-speed/pins.json. Counts, not
# timings: a shared runner's timings are noise, a statement or a request is
# not. A count above its pin fails, naming it; one below fails too, so the pin
# is lowered in the pull request that earned it. PostgreSQL also runs the start
# with every round trip delayed and with 45 more collections, and fails when
# the start's statements grow with either more than they did when pinned.
#
# Its own workflow, so its trigger stays as narrow as what it counts: the
# packages the admin and the start are made of, the playground, the templates,
# the check itself and the lockfile.

on:
  push:
    branches: [main, dev]
    paths:
      - "packages/**"
      - "apps/playground/**"
      - "templates/**"
      - "e2e/admin-speed/**"
      - "e2e/support/e2e-database.mjs"
      - "e2e/support/server-database.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/admin-speed.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "packages/**"
      - "apps/playground/**"
      - "templates/**"
      - "e2e/admin-speed/**"
      - "e2e/support/e2e-database.mjs"
      - "e2e/support/server-database.mjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/admin-speed.yml"
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push supersedes its last run; every other run keeps a
# group of its own commit.
concurrency:
  group: admin-speed-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  counts:
    name: Admin speed counts
    runs-on: ubuntu-latest
    # One production build, then three cold starts with a browser each, and
    # two more starts on PostgreSQL (one of them with every round trip held
    # 100 ms, which today is the longest part).
    timeout-minutes: 45
    env:
      TURBO_CACHE_DIR: .turbo
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/postgresql/data
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nextly
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pnextly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --tmpfs /var/lib/mysql

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Restore pnpm store
        uses: ./.github/actions/pnpm-store

      - name: Restore Turbo cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-v2-${{ runner.os }}-${{ github.job }}-admin-speed-${{ github.sha }}
          restore-keys: |
            turbo-v2-${{ runner.os }}-${{ github.job }}-admin-speed-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Chromium and its system libraries
        uses: ./.github/actions/chromium

      - name: Build packages
        run: pnpm turbo build --filter='./packages/*'

      - name: Count, and compare with the pins
        run: node e2e/admin-speed/measure.mjs --build --json e2e/.playwright/admin-speed/measured.json
        env:
          E2E_DB_SERVER_URL_POSTGRESQL: postgres://postgres:postgres@127.0.0.1:5432
          E2E_DB_SERVER_URL_MYSQL: mysql://root:nextly@127.0.0.1:3306

      - name: Upload the counts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-speed-counts
          path: e2e/.playwright/admin-speed
          retention-days: 14
