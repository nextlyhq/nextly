name: PR Title

# The title is checked where it is written, when a pull request opens or its
# title changes, and again in the merge queue, where the squash commit is built
# from it. `scripts/pr-title.mjs` does both, so one rule has one implementation.
#
# `pull_request_target` runs this workflow as it is on `main`, never as a pull
# request changed it, which is what lets a pull request from a fork be checked
# at all. So the two jobs split what they may do. The job that runs this
# repository's code holds a read-only token. The one job that can write, to post
# or clear the comment below, checks nothing out and runs no repository code.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  lint:
    name: Validate PR title follows Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      error_message: ${{ steps.lint_pr_title.outputs.error_message }}
    steps:
      # The validator runs from code no queued change has touched: `main` on
      # `pull_request_target`, never a pull request's head, and on `merge_group`
      # the queue's base, `main` as the queue found it. There, the full history
      # is fetched too, so the commits the queue would land can be read.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate
        id: lint_pr_title
        uses: ./.github/actions/pr-title
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            nextly
            admin
            admin-css
            client
            ui
            adapter-postgres
            adapter-mysql
            adapter-sqlite
            adapter-drizzle
            storage-s3
            storage-vercel-blob
            storage-uploadthing
            blocks-engine
            blocks-react
            builder
            plugin-form-builder
            plugin-mcp
            plugin-page-builder
            plugin-seo
            plugin-sdk
            create-nextly-app
            eslint-config
            eslint-plugin
            module-specifiers
            prettier-config
            tsconfig
            telemetry
            playground
            root
            ci
            docs
            deps
            release
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" starts with an uppercase character. Rewrite it lowercase to match Conventional Commits.

  # Only a pull request has somewhere to comment. `always()` so a refused title
  # is still explained, and the result of `lint` decides between posting and
  # clearing: a check that failed for any other reason leaves the comment as it
  # was rather than clearing an explanation that may still hold.
  comment:
    name: Explain the title check on the pull request
    needs: lint
    if: ${{ always() && github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post sticky comment on failure
        if: ${{ needs.lint.outputs.error_message != '' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title-lint-error
          message: |
            ### PR title fails Conventional Commits check

            ```
            ${{ needs.lint.outputs.error_message }}
            ```

            Examples of valid titles:
            - `feat(admin): add role manager dialog`
            - `fix(adapter-postgres): handle connection pool exhaustion`
            - `chore(deps): bump zod to 4.2.0`

      - name: Clear sticky comment on success
        if: ${{ needs.lint.result == 'success' }}
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: pr-title-lint-error
          delete: true
