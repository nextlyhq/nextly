name: Integration request

# Adding `run-integration` to a pull request starts Integration's database
# legs on its head. Integration itself does not trigger on `labeled`, because
# then every label would start a run of it: another full three-leg run on a
# pull request already labelled, or a later `skipped` run on the same commit
# that hides the first run's result. This workflow runs on the label alone and
# re-runs the head's Integration run once its legs have skipped; that run's
# `changes` job reads the labels again and runs them. The reasoning, and each
# case it waits for, is in `scripts/integration-request.mjs`.
#
# Any other label skips the one job here, under its own name, and touches no
# Integration check. On a fork's pull request the token cannot re-run a
# workflow, so the job fails and says to re-run Integration by hand.
on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

# Keyed by the label as well, so adding another label (whose run skips its
# job) never cancels a request still waiting for the head's run to finish;
# adding `run-integration` again replaces the earlier request.
concurrency:
  group: integration-request-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  rerun:
    name: Run Integration on request
    if: github.event.label.name == 'run-integration'
    runs-on: ubuntu-latest
    # The script waits at most ten minutes for a run that is finishing.
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Re-run the head's Integration run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/integration-request.mjs rerun
