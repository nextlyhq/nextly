name: Code hygiene

# Per-PR check that a change does not leave dead code, a broken import or a
# stray dependency behind.
#
# ESLint reads one file at a time, so nothing in CI could see an export with no
# consumers, a `vi.mock` pointing at a module that no longer exists, or a
# package listed in a manifest that no code imports. Fallow reads the whole
# module graph, which is what makes those visible.
#
# It analyses the WHOLE repository, not the diff, because the file a change
# breaks is often one it never opened: deleting the last call to an exported
# helper orphans that export somewhere else entirely, and a diff-scoped reader
# cannot see it. `templates/` is the one tree left out — those four are
# fragments with no package.json of their own, composed into a project by
# create-nextly-app at scaffold time, so read in place every specifier in them
# is unresolvable.
#
# What keeps a whole-repo verdict usable is the BASELINE. The tree carries debt
# this job is not here to relitigate — 47 import cycles through the admin page
# registry, ~846 clone groups, ~1200 functions over the complexity thresholds —
# and a bare whole-repo run reports every one of them on every pull request. So
# the base commit is analysed too and the head compared against it: only what
# the change ADDS can fail, and only what it adds is annotated. Nothing here is
# `continue-on-error`; a red run means this pull request introduced something.
#
# Three analyses rather than one, because a single `fallow --baseline` applies
# its baseline to dead code alone and the combined run then fails on inherited
# duplication and complexity. Of the three, only dead code GATES — the step
# below records which of the other two can be enforced and why they cannot.
#
# The baselines are computed per run rather than committed. A checked-in
# baseline is a second copy of a fact the repository already holds, and it goes
# stale silently — every pull request after a merge would measure against
# whatever main looked like when someone last remembered to refresh it.
# Deriving them from the pull request's own base costs one extra install and
# three short scans, and cannot be wrong.
#
# Separate from ci.yml because of that: it needs full history and a second
# working tree, and ci.yml checks out with `fetch-depth: 2`.
#
# pull_request only. A push to main has no base to compare against.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # The sticky summary comment. The other two outputs — inline annotations and
  # the job summary — are workflow commands and need no token, which is what
  # lets them render on pull requests from forks.
  pull-requests: write

concurrency:
  group: code-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit the repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history so the base commit can be checked out as a second
          # working tree below; a shallow clone has no object for it.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Resolution needs the store: an import is only "unresolved" once its
      # package is known to be absent, and workspace-to-workspace imports
      # resolve through pnpm's virtual store rather than a path.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The base tree lives outside the workspace so its own files are not
      # analysed by the run below. It needs an install for the same resolution
      # reason; the pnpm store is already warm, so this is mostly linking.
      - name: Baseline the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add /tmp/fallow-base "$BASE_SHA"
          # Its own install, so imports resolve against what the base declared.
          (cd /tmp/fallow-base && pnpm install --frozen-lockfile)
          # Run from HERE, pointed at there. The base predates this branch, so
          # it has neither the fallow devDependency nor .fallowrc.jsonc: `pnpm
          # exec fallow` inside it fails outright, and a scan that found the
          # binary would still read no config and baseline a different policy —
          # comparing two sides under different rules measures nothing.
          #
          # `--save-baseline` exits 1 when the tree it recorded has findings,
          # which the base has by definition — that is not a failure. Anything
          # ABOVE 1 is fallow failing to run, and `|| true` would swallow it:
          # the baseline file would be missing or truncated, every finding in
          # the head would then read as introduced, and the gate would blame
          # the change for the whole repository's debt.
          set +e
          for analysis in dead-code dupes health; do
            pnpm exec fallow "$analysis" \
              --root /tmp/fallow-base \
              --config "$GITHUB_WORKSPACE/.fallowrc.jsonc" \
              --save-baseline "/tmp/base-$analysis.json"
            code=$?
            if [ "$code" -gt 1 ]; then
              echo "::error::fallow $analysis failed to baseline the base commit (exit $code)."
              exit 1
            fi
            # A missing file means the same thing whatever the exit code said.
            if [ ! -s "/tmp/base-$analysis.json" ]; then
              echo "::error::fallow $analysis exited $code but wrote no baseline."
              exit 1
            fi
          done
          set -e

      # One run per analysis. Its exit code IS the verdict, so a second
      # human-format run to read one would recompute the same answer.
      #
      # Only `dead-code` gates, and only it can. Measured at fallow 3.15.0 on
      # this tree:
      #
      #   dead-code  exits 1 on findings, 0 against a baseline that covers them
      #   dupes      exits 0 ALWAYS — 846 clone groups and `--fail-on-issues`
      #              both still exit 0, and its JSON carries no per-group
      #              new-vs-inherited flag to count instead
      #   health     exits 1, but its baseline matches per file and category
      #              (or per function identity) and neither survives the two
      #              sides being different trees: a branch touching none of
      #              them still reported ~50 findings in `admin` and
      #              `plugin-form-builder`
      #
      # So gating on those two would have been theatre: dupes could never fail
      # and health could fail for functions the author never wrote. They are
      # analysed and reported; dead code is analysed, reported and enforced —
      # and it is the one that catches an export orphaned in a file the change
      # never opened, which is why this job reads the whole repository.
      #
      # `set +e` because a findings exit would otherwise abort the step under
      # GitHub's `bash -e`, taking the annotations, the summary and the gate
      # with it and leaving the author a bare red check.
      - name: Analyse the pull request
        id: analyse
        run: |
          set +e
          failed=""
          crashed=""
          for analysis in dead-code dupes health; do
            pnpm exec fallow "$analysis" \
              --baseline "/tmp/base-$analysis.json" \
              --format json > "/tmp/head-$analysis.json" 2> "/tmp/err-$analysis.txt"
            code=$?
            case "$code" in
              0) ;;
              # 1 is "found something". Only dead-code turns that into a verdict.
              1) [ "$analysis" = "dead-code" ] && failed="$failed $analysis" ;;
              # Anything else is fallow failing to run — a bad config, a parse
              # error, a missing baseline. Reporting that as "findings" sends
              # the author hunting for code that is not the problem, so it is
              # surfaced separately and its stderr is not swallowed.
              *) crashed="$crashed $analysis($code)"; cat "/tmp/err-$analysis.txt" >&2 ;;
            esac
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "crashed=$crashed" >> "$GITHUB_OUTPUT"

      # Inline on the offending lines, for the two analyses that gate. Only
      # findings absent from the baseline reach this point, so an unchanged
      # tree annotates nothing.
      #
      # Health is left out for the reason it does not gate: its residue lands
      # on functions the author never touched — 51 of them on a branch that
      # touched none — and an annotation pinned to a line nobody edited reads
      # as a demand rather than a signal. It stays in the job summary, where a
      # repository-wide number belongs.
      - name: Annotate findings
        if: always() && steps.analyse.conclusion != 'skipped'
        run: |
          for analysis in dead-code dupes; do
            pnpm exec fallow report --from "/tmp/head-$analysis.json" \
              --format github-annotations
          done

      - name: Write the job summary
        if: always() && steps.analyse.conclusion != 'skipped'
        run: |
          for analysis in dead-code dupes health; do
            pnpm exec fallow report --from "/tmp/head-$analysis.json" \
              --format github-summary >> /tmp/fallow-summary.md
          done
          cat /tmp/fallow-summary.md >> "$GITHUB_STEP_SUMMARY"

      # One comment per pull request, edited in place on each push rather than
      # appended, so the thread does not fill with superseded verdicts.
      #
      # Skipped for forks: their token is read-only by design, and a step that
      # cannot post should not fail a check the fork author cannot influence.
      # Annotations and the job summary still render for them.
      - name: Comment on the pull request
        if: >-
          always() && steps.analyse.conclusion != 'skipped'
          && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm exec fallow ci post-pr-comment \
            --provider github \
            --pr "${{ github.event.pull_request.number }}" \
            --body /tmp/fallow-summary.md \
            --marker-id code-hygiene \
            ${{ steps.analyse.outputs.failed == '' && '--clean' || '' }}

      - name: Gate
        if: always() && (steps.analyse.outputs.failed != '' || steps.analyse.outputs.crashed != '')
        run: |
          if [ -n "${{ steps.analyse.outputs.crashed }}" ]; then
            echo "::error::fallow failed to run:${{ steps.analyse.outputs.crashed }}. This is a tooling failure, not a finding in the change — its stderr is in the analysis step above."
            exit 1
          fi
          echo "::error::fallow reported dead code introduced by this pull request:${{ steps.analyse.outputs.failed }}. See the annotations above and the job summary."
          exit 1
