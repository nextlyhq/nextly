name: Code hygiene

# Two jobs, because the two questions have different answers and only one of
# them can be enforced honestly.
#
# ESLint reads one file at a time, so nothing in CI could see an export with no
# consumers, a `vi.mock` pointing at a module that no longer exists, or a
# package listed in a manifest that no code imports. Fallow reads the whole
# module graph, which is what makes those visible.
#
# GATE analyses the changed files and fails on what the change introduced.
# `fallow audit --gate new-only` does that natively: it snapshots the base
# alongside the head, attributes each finding to a side, and reports a
# severity-aware pass/warn/fail. The attribution is the tool's own, so a rename
# does not read as a new finding the way baseline-identity matching does.
#
# It gates on introduced DUPLICATION as well as dead code, which is easy to
# miss because the bare `fallow dupes` command cannot. Measured: adding one
# 156-line clone moved `duplication_introduced` from 0 to 1 and the verdict
# from `warn` to `fail`, with the dead-code count unchanged. Complexity is
# attributed too and stays warn-tier, so it reports without failing.
#
# WHOLE-REPO scans the whole repository at the PR branch HEAD, providing
# complete visibility into dead code and duplication across all packages
# (excluding apps/playground) via GitHub Step Summary and a sticky PR comment.
#
# `templates/` is left out of both. Those four are fragments with no
# package.json of their own, composed into a project by create-nextly-app at
# scaffold time, so read in place every specifier in them is unresolvable.
#
# pull_request only. A push to main has no base to compare against.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # The sticky comment and inline annotations the workflow posts.
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: code-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The audit derives its own base snapshot from history, so a shallow
          # clone leaves it nothing to attribute against.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Resolution needs the store: an import is only "unresolved" once its
      # package is known to be absent, and workspace-to-workspace imports
      # resolve through pnpm's virtual store rather than a path.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The action resolves the CLI from this repository's own `fallow`
      # devDependency rather than taking latest, so the binary and
      # .fallowrc.jsonc are always a matched pair. The action ref and the CLI
      # version are independent, and both are pinned.
      - name: Audit the changed files
        id: audit
        uses: fallow-rs/fallow@ecf5a314fd3e10974acb4f5a7f867c433030522d # v3.17.0
        with:
          command: audit
          config: .fallowrc.jsonc
          gate: new-only
          fail-on-issues: true
          comment: false
          annotations: true
          # playground is a dev harness, not a published package. Excluding it
          # keeps the gate focused on the packages that ship to consumers and
          # prevents its intentional loose dependency declarations from
          # appearing as findings in unrelated pull requests.
          workspace: "!playground"
      - name: Generate audit review envelope
        if: always() && steps.audit.conclusion != 'skipped'
        run: |
          pnpm exec fallow audit \
            --gate new-only \
            --workspace "!playground" \
            --config .fallowrc.jsonc \
            --format review-github > /tmp/audit-review.json 2>/dev/null || true

      - name: Post PR review comments for changed files
        if: always() && steps.audit.conclusion != 'skipped' && github.event.pull_request.number != null
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = context.issue.number;

            if (!fs.existsSync('/tmp/audit-review.json')) return;
            let review;
            try {
              review = JSON.parse(fs.readFileSync('/tmp/audit-review.json', 'utf8'));
            } catch (err) {
              return;
            }

            if (!review.comments || review.comments.length === 0) return;

            // Fetch existing review comments on this PR to prevent duplicate threads
            let existingComments = [];
            try {
              const res = await github.rest.pulls.listReviewComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              });
              existingComments = res.data || [];
            } catch (err) {
              console.log('Warning: could not fetch existing review comments:', err.message);
            }

            // Filter out comments that are already present on the same file & line
            const newComments = review.comments.filter(c => {
              return !existingComments.some(existing =>
                existing.path === c.path &&
                (existing.line === c.line || existing.original_line === c.line) &&
                existing.body && (existing.body.trim() === c.body.trim() || existing.body.includes(c.body.trim()))
              );
            });

            if (newComments.length === 0) {
              console.log('All audit review comments are already present on this PR. Skipping duplicate review creation.');
              return;
            }

            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                commit_id: context.payload.pull_request.head.sha,
                event: 'COMMENT',
                body: review.body || '### 🛑 Fallow Audit: Issues found in changed files',
                comments: newComments.map(c => ({
                  path: c.path,
                  line: c.line,
                  body: c.body,
                })),
              });
              console.log(`Successfully posted ${newComments.length} new audit review comment(s).`);
            } catch (err) {
              console.log('Could not post PR review threads:', err.message);
            }

      # A degraded run reports nothing and reads exactly like a clean one, so
      # the states the action exposes for that are read rather than trusted.
      # `changed-files-unavailable` means it could not enumerate the pull
      # request's files and therefore analysed everything; the other two mean a
      # dedup lookup failed, so the comment either duplicated or was dropped.
      # None of them is a finding in the change, so each says so in its own
      # words instead of arriving as a bare red check.
      - name: Refuse a degraded verdict
        if: always() && steps.audit.conclusion != 'skipped'
        env:
          UNSCOPED: ${{ steps.audit.outputs.changed-files-unavailable }}
          POST_SKIPPED: ${{ steps.audit.outputs.post-skipped-reason }}
          DEDUP_FAILED: ${{ steps.audit.outputs.dedup-lookup-failed }}
          VERDICT: ${{ steps.audit.outputs.verdict }}
          GATE: ${{ steps.audit.outputs.gate }}
        run: |
          echo "verdict=${VERDICT:-<none>} gate=${GATE:-<none>}"
          if [ "$UNSCOPED" = "true" ]; then
            echo "::error::fallow could not enumerate the changed files, so the audit ran unscoped. That is a tooling failure rather than a finding in the change. Re-run the job."
            exit 1
          fi
          if [ "$DEDUP_FAILED" = "true" ] || { [ -n "$POST_SKIPPED" ] && [ "$POST_SKIPPED" != "none" ]; }; then
            echo "::warning::fallow could not reconcile its own pull-request comment (dedup-lookup-failed=$DEDUP_FAILED, post-skipped-reason=$POST_SKIPPED). The verdict still stands; only the comment is unreliable."
          fi
          # An empty verdict is the gate never having produced one, which is not
          # a pass. Absence of a failure is not a verdict.
          if [ -z "$VERDICT" ]; then
            echo "::error::fallow produced no audit verdict."
            exit 1
          fi

  whole-repo:
    name: Whole repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Explicitly checkout the PR head commit to avoid scanning the synthetic merge ref
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No baseline step: this job reports the full current state of the PR
      # branch rather than a diff against main. Every finding in the repo is
      # shown so the author can see the real picture, not just what their
      # change added.

      # One run per analysis. `set +e` because a findings exit (code 1) would
      # otherwise abort the step under GitHub's `bash -e`, taking the summary
      # with it. Dead code, dupes, and health are all reported in the summary.
      # Anything above 1 is a fallow crash, surfaced separately.
      - name: Analyse the whole repository
        id: analyse
        run: |
          set +e
          crashed=""
          for analysis in dead-code dupes health; do
            pnpm exec fallow "$analysis" \
              --workspace "!playground" \
              --config .fallowrc.jsonc \
              --format json > "/tmp/head-$analysis.json" 2> "/tmp/err-$analysis.txt"
            code=$?
            case "$code" in
              0|1) ;;
              # Anything above 1 is fallow failing to run (bad config, parse
              # error). Surface stderr so the author knows it is tooling.
              *) crashed="$crashed $analysis($code)"; cat "/tmp/err-$analysis.txt" >&2 ;;
            esac
          done
          echo "crashed=$crashed" >> "$GITHUB_OUTPUT"

      # The job summary is where this job writes its output.
      - name: Write the job summary
        if: always() && steps.analyse.conclusion != 'skipped'
        run: |
          {
            echo "## Whole-Repository Code Hygiene Summary"
            echo
            echo "Full dead-code, duplication, and health/complexity report for the"
            echo "PR branch as it stands now. Playground is excluded. Quality gate"
            echo "enforcement on introduced issues is performed by the Changed files job."
            echo
            for analysis in dead-code dupes health; do
              pnpm exec fallow report --from "/tmp/head-$analysis.json" --format github-summary
            done
          } > "/tmp/whole-repo-summary.md"
          cat "/tmp/whole-repo-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update whole-repo sticky comment
        if: always() && steps.analyse.conclusion != 'skipped' && github.event.pull_request.number != null
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const prNumber = context.issue.number;
            const commentMarker = '<!-- fallow:whole-repo-hygiene -->';

            let summaryContent = '';
            if (fs.existsSync('/tmp/whole-repo-summary.md')) {
              summaryContent = fs.readFileSync('/tmp/whole-repo-summary.md', 'utf8');
            }

            if (!summaryContent.trim()) {
              summaryContent = `## Whole-Repository Code Hygiene Summary\n\nFull scan completed for PR #${prNumber}.`;
            }

            const commentBody = `${commentMarker}\n${summaryContent}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(commentMarker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody,
              });
            }

      # Fails only if fallow encountered a tooling failure/crash.
      - name: Gate
        if: always() && steps.analyse.outputs.crashed != ''
        run: |
          echo "::error::fallow failed to run:${{ steps.analyse.outputs.crashed }}. That is a tooling failure — its stderr is in the analysis step above."
          exit 1
