name: Independent review

# The merge queue lands a pull request only when a model from a different
# family than the one that wrote it has reviewed the exact revision it lands.
# `scripts/independent-review.mjs` carries the rule, the reviewers it accepts
# and the evidence it reads.
#
# It decides in the queue, where the reviews a pull request is going to get
# have had their chance to arrive. On a pull request the job is skipped, which
# is a result the queue can be entered with; the queue is where this is held.
#
# It runs the queue base's copy of the script, so no queued change judges its
# own review. It follows that the check can be made required only once this
# workflow and its script are on `main`: before that, a base without them fails
# the job.
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions: {}

# One run per pull request at a time: a newer push cancels the older run,
# which checks a revision that is no longer the head. Each workflow keys its
# own group, so the workflows of one push never cancel one another; a push to
# `main` and the queue's runs are keyed by commit and never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    name: Independent review of the revision being merged
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      # The decision runs from the queue's base, `main` as the queue found it,
      # so no queued change judges its own review. The full history is fetched
      # so the commits the queue would land can be read.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/independent-review.mjs
