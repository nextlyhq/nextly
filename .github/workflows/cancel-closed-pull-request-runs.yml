name: Cancel closed pull request runs

# When a pull request is merged or closed, its queued and running
# pull-request runs can no longer decide anything, yet each holds a runner
# other pull requests are waiting for. A concurrency group cancels a run only
# when a newer one joins it, and closing starts none, so this cancels them, for
# every workflow at once. Runs of a push to `main`, the merge queue and
# schedules are never touched: see `scripts/cancel-closed-pull-request-runs.mjs`.
#
# The same job then deletes the Actions caches the pull request's runs saved
# under its merge ref, which nothing reads once it is closed and which would
# otherwise hold the repository's cache allowance until eviction reaches them,
# taking `main`'s caches with them: see
# `scripts/delete-closed-pull-request-caches.mjs`.
#
# On a fork's pull request the token cannot cancel runs or delete caches, so
# the job fails and says so; those runs then finish on their own.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  cancel:
    name: Cancel the closed pull request's runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      # The script runs from the default branch, never from the closed pull
      # request: this job holds `actions: write`, and a pull request that was
      # rejected must not be able to run its own version of the script with it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts
            .nvmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Cancel
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cancel-closed-pull-request-runs.mjs
      # After the cancel, so a run it stopped cannot save a cache afterwards
      # (a cancelled job saves none), and whatever the cancel's verdict, so a
      # run it could not stop does not keep the caches too.
      - name: Delete its caches
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/delete-closed-pull-request-caches.mjs
