# Which dependencies may run install scripts. `allowBuilds` (pnpm 10.26+)
# replaces `onlyBuiltDependencies` / `neverBuiltDependencies`, and anything
# NOT listed here is denied and reported as unreviewed rather than denied
# silently — so a new native dependency shows up as a decision to make,
# which is the point. `pnpm ignored-builds` prints the current verdicts.
#
# The `false` is as deliberate as the `true`s: msgpackr-extract is an OPTIONAL
# native accelerator for msgpackr, which falls back to its JavaScript path when
# the binding is absent. Nothing here needs that speed, so the build stays off
# and the install stops compiling C++ it does not use. Denying it explicitly,
# rather than by omission, is what keeps it from reading as an oversight.
#
# Measured on pnpm 12.5.1: exactly five dependencies in the tree declare an
# install lifecycle hook — @parcel/watcher, better-sqlite3, esbuild,
# msgpackr-extract and unrs-resolver — so this list covers the population with
# nothing left unreviewed. `sharp` is the exception and is kept deliberately:
# 0.35.x ships prebuilt binaries through its `@img/sharp-*` optional packages
# and declares no hook, so the entry is a NO-OP today. It stays as the fallback
# for a platform with no prebuild, where sharp compiles instead.
allowBuilds:
  '@parcel/watcher': true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: false
  sharp: true
  unrs-resolver: true
