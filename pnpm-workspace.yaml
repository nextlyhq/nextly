packages:
  - "apps/*"
  - "packages/*"
  # Browser tests for the composed product, rather than for any one package.
  # Not under packages/ (which is what ships) or apps/ (which is what runs).
  - "e2e"

# `link-workspace-packages` in `.npmrc` until the pnpm 12 migration. pnpm
# reads only auth and registry settings from `.npmrc` now, so it sat there
# being ignored in silence — no warning, just workspace packages resolved
# from the registry instead of from the workspace.
linkWorkspacePackages: true

# Moved from the `pnpm.overrides` block in `package.json` during the pnpm 12
# migration, unchanged entry for entry. Modern pnpm does not read that block,
# so leaving it there would have silently dropped every security floor below.
